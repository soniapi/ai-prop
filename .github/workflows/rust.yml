name: Rust

on:
  push:
    branches: [ "prop" ]
  pull_request:
    branches: [ "prop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Checkout ai-infra
      run: git clone https://github.com/soniapi/ai-infra ../ai-infra
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
